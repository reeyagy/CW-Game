<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Drop Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <img class="brand-logo" src="img/cw_logo-horizontal.png" alt="charity: water">
        <h1 class="game-title">Water Drop</h1>
        <p class="game-tagline">Catch the good drops, avoid the bad ones!</p>
        <div class="score-panel">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="timer">Time: <span id="time">30</span>s</div>
            <label class="difficulty-control" for="difficulty">
                Difficulty
                <select id="difficulty" aria-label="Difficulty">
                    <option value="easy">Easy</option>
                    <option value="normal" selected>Normal</option>
                    <option value="hard">Hard</option>
                </select>
            </label>
            <button id="start-btn">Start Game</button>
            <button id="reset-btn">Reset</button>
        </div>
        <p id="game-result" aria-live="polite" hidden></p>
        
        <div id="game-container">
            <div id="bucket" aria-hidden="true"></div>
        </div>
        <footer class="site-footer">
            <p>Help bring clean water to more communities.</p>
            <nav aria-label="charity: water links">
                <a href="https://www.charitywater.org/">charity: water</a>
                <a href="https://www.charitywater.org/donate">Donate</a>
                <a href="https://www.charitywater.org/monthly">Give monthly</a>
            </nav>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
